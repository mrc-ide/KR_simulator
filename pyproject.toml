[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "krsim"
version = "0.1.0"
description = "Forward simulator of Plasmodium falciparum recombination and transmission dynamics"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tskit",
    "msprime",
    "numpy",
    "pandas",
    "scipy",
    "rich-argparse",
]

[project.optional-dependencies]
# packages for running notebooks/tutorial.ipynb: pip install -e ".[tutorial]"
tutorial = ["matplotlib", "notebook"]

[project.scripts]
krsim = "krsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# defaults for `vcf-host-depth --depth_model`
krsim = ["data/*.json"]
