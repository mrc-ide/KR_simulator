project:
  type: website
  output-dir: _site
  resources:
    - maps/*.html

website:
  title: "krsim"
  description: "Forward simulator of Plasmodium falciparum recombination and transmission dynamics"
  repo-url: https://github.com/mrc-ide/KR_simulator
  repo-actions: [issue]
  page-navigation: true
  sidebar:
    style: docked
    search: true
    tools:
      - icon: github
        href: https://github.com/mrc-ide/KR_simulator
        aria-label: GitHub
    contents:
      - href: index.qmd
        text: Welcome
      - background.qmd
      - installation.qmd
      - section: Tutorial
        contents:
          - tutorial-small.qmd
          - tutorial-realistic.qmd
          - tutorial-scripts.qmd
      - section: Reference
        contents:
          - commands.qmd
          - outputs.qmd
          - scaling.qmd
    footer: |
      <div class="dev-heading">Developers</div>
      <div class="dev-name">Janeesh Kaur Bansal</div>
      <div class="dev-role">Author, maintainer</div>
      <div class="dev-name">Bob Verity</div>
      <div class="dev-role">Supervisor</div>

format:
  html:
    theme:
      light: [cosmo, krsim-light.scss, krsim.scss]
      dark: [darkly, krsim-dark.scss, krsim.scss]
    highlight-style:
      light: krsim-light.theme
      dark: krsim-dark.theme
    toc: true
    toc-location: right
    toc-title: On this page
    code-copy: true

execute:
  enabled: false
